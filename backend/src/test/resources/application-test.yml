app:
  dev-tools: true
  jwt:
    secret: test-only-secret-0123456789abcdef0123456789abcdef0123456789
  cors:
    allowed-origins: https://crm.test
  rate-limit:
    # Flow tests hammer /auth from one address; RateLimitTest turns it back on.
    enabled: false
  media:
    local-dir: ./target/test-media
  jobs:
    # Run background jobs immediately in the caller's thread, so flow tests can
    # assert their effects. JobQueueTest exercises the real worker.
    inline: true
  push:
    # Never call the Expo API from tests.
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:bjjflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
